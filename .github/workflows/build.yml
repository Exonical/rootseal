name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

jobs:
  # ── 1. Test & Lint ──────────────────────────────────────────────────────────
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./internal/...

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: golangci-lint
        run: golangci-lint run ./...

      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude-dir pkg/api ./...

  # ── 2. Build Binaries ───────────────────────────────────────────────────────
  build-binaries:
    name: Build Binaries (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p bin
          go build -ldflags "-s -w" \
            -o bin/rootseal-linux-${{ matrix.arch }} \
            ./cmd/rootseal
          go build -ldflags "-s -w" \
            -o bin/rootseal-controlplane-linux-${{ matrix.arch }} \
            ./cmd/controlplane

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries-linux-${{ matrix.arch }}
          path: bin/

  # ── 3. Build RPM ────────────────────────────────────────────────────────────
  build-rpm:
    name: Build RPM
    runs-on: ubuntu-latest
    needs: test
    container:
      image: rockylinux/rockylinux:10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          dnf install -y systemd-rpm-macros rpm-build rpmdevtools git make tar gzip

      - name: Install Go (matches go.mod / spec minimum)
        run: |
          GOVER="$(sed -n 's/^go //p' go.mod)"
          echo "Installing Go ${GOVER}"
          curl -fsSL "https://go.dev/dl/go${GOVER}.linux-amd64.tar.gz" -o /tmp/go.tgz
          rm -rf /usr/local/go
          tar -C /usr/local -xzf /tmp/go.tgz
          ln -sf /usr/local/go/bin/go /usr/local/bin/go
          ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt
          go version

      - name: Vendor Go modules
        run: go mod vendor

      - name: Build RPMs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//')"
          VERSION="${VERSION:-0.1.0}"
          RELEASE=1
          echo "Building rootseal ${VERSION}-${RELEASE}"
          rpmdev-setuptree
          tar --transform "s,^,rootseal-${VERSION}/," \
              --exclude='.git' \
              --exclude='bin' \
              -czf ~/rpmbuild/SOURCES/rootseal-${VERSION}.tar.gz .
          cp packaging/rootseal.spec ~/rpmbuild/SPECS/rootseal.spec
          sed -i '/^%changelog/,$d' ~/rpmbuild/SPECS/rootseal.spec
          { echo '%changelog'; sh packaging/gen-changelog.sh "${VERSION}" "${RELEASE}"; } >> ~/rpmbuild/SPECS/rootseal.spec
          rpmbuild -ba --nodeps \
            --define "_pkgver ${VERSION}" \
            --define "_pkgrel ${RELEASE}" \
            ~/rpmbuild/SPECS/rootseal.spec

      - name: Collect RPMs
        run: |
          mkdir -p rpms
          find ~/rpmbuild/RPMS -name '*.rpm' -exec cp {} rpms/ \;
          ls -lh rpms/

      - name: Upload RPMs
        uses: actions/upload-artifact@v7
        with:
          name: rpms
          path: rpms/

  # ── 4. FIPS Binaries (amd64, native Go FIPS 140-3) ──────────────────────────
  build-fips-binaries:
    name: Build FIPS Binaries
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build FIPS binaries
        env:
          GOFIPS140: latest
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p bin
          go build -ldflags "-s -w" \
            -o bin/rootseal-fips-linux-amd64 \
            ./cmd/rootseal
          go build -ldflags "-s -w" \
            -o bin/rootseal-controlplane-fips-linux-amd64 \
            ./cmd/controlplane

      - name: Verify native FIPS 140-3 build metadata
        run: |
          for b in bin/rootseal-fips-linux-amd64 bin/rootseal-controlplane-fips-linux-amd64; do
            if go version -m "$b" | grep -q "GOFIPS140=latest"; then
              echo "$b: native FIPS 140-3 OK"
            else
              echo "ERROR: GOFIPS140 not found in $b build metadata"
              exit 1
            fi
          done

      - name: Upload FIPS binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries-fips-linux-amd64
          path: bin/

  # ── 5. FIPS RPM ─────────────────────────────────────────────────────────────
  build-fips-rpm:
    name: Build FIPS RPM
    runs-on: ubuntu-latest
    needs: test
    container:
      image: rockylinux/rockylinux:10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          dnf install -y systemd-rpm-macros rpm-build rpmdevtools git make tar gzip

      - name: Install Go (matches go.mod / spec minimum)
        run: |
          GOVER="$(sed -n 's/^go //p' go.mod)"
          echo "Installing Go ${GOVER}"
          curl -fsSL "https://go.dev/dl/go${GOVER}.linux-amd64.tar.gz" -o /tmp/go.tgz
          rm -rf /usr/local/go
          tar -C /usr/local -xzf /tmp/go.tgz
          ln -sf /usr/local/go/bin/go /usr/local/bin/go
          ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt
          go version

      - name: Vendor Go modules
        run: go mod vendor

      - name: Build FIPS RPMs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          VERSION="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null | sed 's/^v//')"
          VERSION="${VERSION:-0.1.0}"
          RELEASE=1
          echo "Building rootseal ${VERSION}-${RELEASE} (FIPS)"
          rpmdev-setuptree
          tar --transform "s,^,rootseal-${VERSION}/," \
              --exclude='.git' \
              --exclude='bin' \
              -czf ~/rpmbuild/SOURCES/rootseal-${VERSION}.tar.gz .
          cp packaging/rootseal.spec ~/rpmbuild/SPECS/rootseal.spec
          sed -i '/^%changelog/,$d' ~/rpmbuild/SPECS/rootseal.spec
          { echo '%changelog'; sh packaging/gen-changelog.sh "${VERSION}" "${RELEASE}"; } >> ~/rpmbuild/SPECS/rootseal.spec
          rpmbuild -ba --nodeps \
            --with fips_build \
            --define "_pkgver ${VERSION}" \
            --define "_pkgrel ${RELEASE}" \
            ~/rpmbuild/SPECS/rootseal.spec

      - name: Collect FIPS RPMs
        run: |
          mkdir -p rpms-fips
          find ~/rpmbuild/RPMS -name '*fips*.rpm' -exec cp {} rpms-fips/ \;
          ls -lh rpms-fips/

      - name: Upload FIPS RPMs
        uses: actions/upload-artifact@v7
        with:
          name: rpms-fips
          path: rpms-fips/

  # ── 6. GitHub Release (tags only) ───────────────────────────────────────────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-binaries, build-rpm, build-fips-binaries, build-fips-rpm]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download binaries (amd64)
        uses: actions/download-artifact@v7
        with:
          name: binaries-linux-amd64
          path: release/

      - name: Download binaries (arm64)
        uses: actions/download-artifact@v7
        with:
          name: binaries-linux-arm64
          path: release/

      - name: Download RPMs
        uses: actions/download-artifact@v7
        with:
          name: rpms
          path: release/

      - name: Download FIPS binaries
        uses: actions/download-artifact@v7
        with:
          name: binaries-fips-linux-amd64
          path: release/

      - name: Download FIPS RPMs
        uses: actions/download-artifact@v7
        with:
          name: rpms-fips
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
